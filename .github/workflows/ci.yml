name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  # The `.cargo/config.toml` rustflag for getrandom's custom backend is
  # inconsistently picked up in CI (other shape-B capsules happen to
  # work, this one doesn't — likely a cargo-config-vs-cache interaction).
  # Setting RUSTFLAGS at workflow-env level is highest-priority and
  # bypasses the issue. Mirror the config.toml content so the workspace
  # build sees the same flags either way.
  RUSTFLAGS: --cfg=getrandom_backend="custom"

jobs:
  check:
    name: Check & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt

      # Force rustup to materialise the wasm32-unknown-unknown rust-std for
      # the rust-toolchain.toml-pinned version (1.94.0) before cargo runs.
      # dtolnay installs the target for the action's `toolchain:` channel
      # (stable, currently 1.95.0). When rust-toolchain.toml then switches
      # cargo to 1.94.0, the wasm target may not yet exist for 1.94.0 —
      # rustup auto-install via the `targets` field is meant to cover that
      # but races with parallel compile jobs on this repo. The explicit
      # install removes the ambiguity.
      - name: Install wasm32 target for pinned toolchain
        run: rustup target add wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --target wasm32-unknown-unknown -- -D warnings

      - name: Build WASM
        run: cargo build --release --target wasm32-unknown-unknown

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: capsule-wasm
          path: target/wasm32-unknown-unknown/release/*.wasm
          if-no-files-found: error
